<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOVA — Skincare & Sun care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F4;--surface:#FFFFFF;--ink:#1B1D21;--muted:#61656C;--faint:#8E9299;
  --line:#E3E5E9;--blue:#1B57C4;--deal:#C93A12;--deal-soft:#FDEDE7;--star:#F5A623;
  --badge:#F0A020;--green:#1E7B34;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--sans);background:#DCDEE2;color:var(--ink);line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased;}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.08);}

/* header */
.topbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);}
.topbar-main{display:flex;align-items:center;gap:10px;padding:10px 14px;}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--blue);background:none;border:none;cursor:pointer;padding:2px;}
.search{flex:1;display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;}
.search svg{flex-shrink:0;color:var(--faint);}
.search input{border:none;background:none;outline:none;font-family:var(--sans);font-size:14px;width:100%;}
.ico{background:none;border:none;cursor:pointer;padding:6px;position:relative;color:var(--ink);display:flex;}
.cbadge{position:absolute;top:0;right:-1px;background:var(--deal);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px;}
.cbadge.on{display:flex;}
.catnav{display:flex;gap:16px;padding:0 14px 9px;overflow-x:auto;scrollbar-width:none;}
.catnav::-webkit-scrollbar{display:none;}
.catnav button{background:none;border:none;font-family:var(--sans);font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;padding:2px 0;}
.catnav button.act{color:var(--ink);font-weight:600;border-bottom:2px solid var(--blue);}
.crumbs{padding:9px 14px;font-size:12px;color:var(--faint);}
.crumbs span{color:var(--muted);}
.back{background:none;border:none;cursor:pointer;font-family:var(--sans);font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:5px;padding:4px 2px;}

.view{display:none;}
.view.on{display:block;}
.card{background:var(--surface);margin-bottom:8px;padding:14px;}

/* ---------- GALLERY (fixed sizing) ---------- */
.gal{background:var(--surface);}
.gal-main{position:relative;background:#FAFAFB;height:320px;padding:14px;}
.gal-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.gal-stage svg,.gal-stage img{width:100%;height:100%;display:block;}
.gal-stage img{object-fit:contain;}
.gal-count{position:absolute;bottom:10px;right:12px;background:rgba(27,29,33,.62);color:#fff;font-size:11px;padding:3px 8px;border-radius:10px;}
.thumbs{display:flex;gap:7px;padding:10px 14px 12px;overflow-x:auto;scrollbar-width:none;}
.thumbs::-webkit-scrollbar{display:none;}
.thumb-b{width:54px;height:54px;flex-shrink:0;border:1.5px solid var(--line);border-radius:5px;background:#FAFAFB;cursor:pointer;padding:4px;}
.thumb-b.act{border-color:var(--blue);}
.thumb-b svg,.thumb-b img{width:100%;height:100%;display:block;}
.thumb-b img{object-fit:contain;}

/* badges */
.bestseller{display:inline-flex;align-items:center;gap:5px;background:var(--badge);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;margin-bottom:9px;}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:3px;}
.tag.deal{background:var(--deal-soft);color:var(--deal);}

/* product head */
.brandlink{font-size:13px;color:var(--blue);font-weight:500;margin-bottom:3px;display:block;text-decoration:none;}
h1{font-size:19px;font-weight:600;line-height:1.32;letter-spacing:-.01em;}
.psize{font-size:13px;color:var(--muted);margin-top:3px;}
.ratebar{display:flex;align-items:center;gap:7px;margin-top:9px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.stars{display:flex;gap:1px;}
.stars svg{width:13px;height:13px;}
.rlink{font-size:13px;color:var(--blue);cursor:pointer;}
.rnum{font-size:13px;font-weight:600;}
.pmain{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:12px;}
.punit{font-size:12px;color:var(--faint);margin-top:2px;}
.delivery{display:flex;align-items:flex-start;gap:7px;margin-top:11px;font-size:13px;color:var(--muted);}
.delivery b{color:var(--ink);font-weight:600;}
.delivery svg{flex-shrink:0;margin-top:2px;color:var(--green);}
.seller{font-size:12.5px;color:var(--muted);margin-top:8px;}
.seller a{color:var(--blue);text-decoration:none;}

.btn{width:100%;font-family:var(--sans);font-size:15px;font-weight:600;padding:13px;border-radius:6px;border:none;cursor:pointer;transition:opacity .15s;}
.btn:hover{opacity:.88;}
.btn.primary{background:var(--blue);color:#fff;}
.btn.secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);}
.btn.deal{background:var(--deal);color:#fff;}
.btnstack{display:flex;flex-direction:column;gap:8px;margin-top:14px;}

.sh{font-size:15.5px;font-weight:600;margin-bottom:11px;}
.sh-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.sh-row h2{font-size:15.5px;font-weight:600;}
.sh-row a{font-size:13px;color:var(--blue);text-decoration:none;}
.body-txt{font-size:14px;color:var(--muted);}
.feat{list-style:none;margin-top:10px;}
.feat li{font-size:13.8px;color:var(--muted);padding-left:16px;position:relative;margin-bottom:7px;}
.feat li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--blue);}

/* bundle */
.bundle{display:flex;align-items:center;gap:6px;margin-bottom:12px;}
.bcell{flex:1;text-align:center;cursor:pointer;}
.bcell:hover .bimg{border-color:var(--blue);}
.bcell:hover .bname{color:var(--blue);text-decoration:underline;}
.bimg{height:86px;background:#FAFAFB;border:1px solid var(--line);border-radius:5px;padding:6px;transition:border-color .15s;}
.bimg svg,.bimg img{width:100%;height:100%;display:block;}
.bimg img{object-fit:contain;}
.bname{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.3;}
.bprice{font-size:12.5px;font-weight:600;margin-top:2px;}
.bplus{font-size:19px;color:var(--faint);font-weight:300;}
.bundle-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.bundle-price .old{font-size:13px;color:var(--faint);text-decoration:line-through;}
.bundle-price .new{font-size:20px;font-weight:700;color:var(--deal);}
.bundle-save{font-size:12px;color:var(--deal);font-weight:600;}

/* rich content */
.rich-panel{margin-bottom:16px;}
.rich-img{width:100%;height:172px;border-radius:6px;overflow:hidden;background:#F7F8FA;}
.rich-img svg,.rich-img img{width:100%;height:100%;display:block;}
.rich-img img{object-fit:cover;}
.rich-cap{font-size:14px;font-weight:600;margin-top:9px;}
.rich-txt{font-size:13.5px;color:var(--muted);margin-top:3px;}

/* rails */
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.rail::-webkit-scrollbar{display:none;}
.pcard{width:140px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px;cursor:pointer;text-align:left;font-family:var(--sans);}
.pcard:hover{border-color:var(--blue);}
.pcard-img{height:100px;background:#FAFAFB;border-radius:4px;margin-bottom:8px;padding:5px;}
.pcard-img svg,.pcard-img img{width:100%;height:100%;display:block;}
.pcard-img img{object-fit:contain;}
.pcard-brand{font-size:10.5px;color:var(--faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.pcard-name{font-size:12.5px;line-height:1.32;margin-top:2px;height:33px;overflow:hidden;}
.pcard-rate{display:flex;align-items:center;gap:3px;margin-top:5px;}
.pcard-rate .stars svg{width:10px;height:10px;}
.pcard-rate span{font-size:10.5px;color:var(--faint);}
.pcard-price{font-size:14.5px;font-weight:700;margin-top:5px;}

/* ad */
.ad{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:linear-gradient(115deg,#0E3A5C 0%,#1B6FA8 55%,#37A0C4 100%);padding:18px 16px;min-height:122px;display:flex;align-items:center;gap:10px;}
.ad-label{position:absolute;top:7px;right:9px;font-size:10px;color:rgba(255,255,255,.72);background:rgba(0,0,0,.22);padding:2px 6px;border-radius:3px;}
.ad-txt{flex:1;z-index:2;}
.ad-brand{font-size:11px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.82);}
.ad-head{font-size:18px;font-weight:700;color:#fff;line-height:1.25;margin-top:5px;}
.ad-sub{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:4px;}
.ad-cta{display:inline-block;margin-top:10px;background:#fff;color:#0E3A5C;font-size:12px;font-weight:600;padding:6px 12px;border-radius:4px;}
.ad-art{width:74px;height:100px;flex-shrink:0;z-index:2;}
.ad-art svg{width:100%;height:100%;display:block;}
.ad-banner{padding:0;min-height:0;background:none;display:block;}
.ad-banner img{width:100%;height:auto;display:block;object-fit:contain;}

/* store page */
.store-hero{background:linear-gradient(135deg,#1B57C4 0%,#3D7BE0 100%);padding:18px 14px 16px;color:#fff;}
.store-top{display:flex;align-items:center;gap:12px;}
.store-mark{width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:12px;
  color:var(--blue);text-align:center;line-height:1.05;padding:3px;}
.store-nm{flex:1;min-width:0;}
.store-nm h2{font-size:17px;font-weight:700;line-height:1.25;}
.store-meta{font-size:11.5px;color:rgba(255,255,255,.86);margin-top:3px;}
.store-follow{background:#fff;color:var(--blue);border:none;border-radius:6px;padding:8px 14px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;}
.store-blurb{font-size:12.5px;color:rgba(255,255,255,.92);margin-top:11px;line-height:1.45;}
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sg-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px;
  cursor:pointer;font-family:var(--sans);text-align:left;}
.sg-card:hover{border-color:var(--blue);}
.sg-img{height:104px;background:#FAFAFB;border-radius:5px;padding:6px;}
.sg-img svg,.sg-img img{width:100%;height:100%;display:block;}
.sg-img img{object-fit:contain;}
.sg-nm{font-size:12.5px;line-height:1.3;margin-top:7px;height:33px;overflow:hidden;}
.sg-rate{display:flex;align-items:center;gap:3px;margin-top:4px;}
.sg-rate .stars svg{width:10px;height:10px;}
.sg-rate span{font-size:10.5px;color:var(--faint);}
.sg-price{font-size:14.5px;font-weight:700;margin-top:4px;}
/* reviews */
.revsum{display:flex;gap:18px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px;}
.revbig{text-align:center;}
.revbig .n{font-size:32px;font-weight:700;line-height:1;}
.revbig .stars{justify-content:center;margin-top:5px;}
.revbig .c{font-size:11.5px;color:var(--faint);margin-top:4px;white-space:nowrap;}
.dist{flex:1;}
.dist-row{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.dist-row .lbl{font-size:11px;color:var(--muted);width:26px;}
.dist-bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;}
.dist-fill{height:100%;background:var(--star);}
.dist-row .pct{font-size:11px;color:var(--faint);width:28px;text-align:right;}
.rev{padding:13px 0;border-bottom:1px solid var(--line);}
.rev:last-child{border-bottom:none;}
.rev-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
.rev-top .stars svg{width:11px;height:11px;}
.rev-name{font-size:12.5px;font-weight:600;}
.rev-ver{font-size:10.5px;color:var(--green);font-weight:500;}
.rev-date{font-size:11.5px;color:var(--faint);margin-left:auto;}
.rev-body{font-size:13.5px;color:var(--muted);}

/* cart */
.ptitle{font-size:20px;font-weight:600;margin-bottom:14px;}
.li{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.li-img{width:66px;height:82px;flex-shrink:0;background:#FAFAFB;border:1px solid var(--line);border-radius:5px;padding:5px;}
.li-img svg,.li-img img{width:100%;height:100%;display:block;}
.li-img img{object-fit:contain;}
.li-b{flex:1;min-width:0;}
.li-brand{font-size:10.5px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.li-name{font-size:13.5px;font-weight:500;line-height:1.32;margin-top:1px;}
.li-price{font-size:14.5px;font-weight:600;margin-top:5px;}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;margin-top:7px;}
.qty button{width:29px;height:29px;background:none;border:none;cursor:pointer;font-size:15px;}
.qty span{min-width:28px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;}
.rm{background:none;border:none;cursor:pointer;font-size:12.5px;color:var(--faint);text-decoration:underline;padding:0;margin-top:8px;}
.tot{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);padding:5px 0;}
.tot.grand{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:16.5px;color:var(--ink);font-weight:700;}
.empty{text-align:center;padding:60px 20px;}
.empty p{color:var(--muted);margin-bottom:18px;}

/* forms */
.fs{margin-bottom:20px;}
.fs h3{font-size:13px;font-weight:600;margin-bottom:10px;}
.fld{margin-bottom:10px;}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
.fld input{width:100%;font-family:var(--sans);font-size:16px;padding:11px;border:1px solid var(--line);border-radius:5px;}
.fld input:focus{outline:none;border-color:var(--blue);}
.r2{display:flex;gap:10px;}
.r2 .fld{flex:1;}

.confirm{text-align:center;padding:56px 20px;}
.ok{width:50px;height:50px;border-radius:50%;background:#E6F3E9;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.confirm h2{font-size:22px;font-weight:600;margin-bottom:8px;}
.confirm p{color:var(--muted);font-size:14px;}
.ono{font-size:12.5px;color:var(--faint);margin-top:12px;}

.sticky{position:sticky;bottom:0;z-index:50;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px;align-items:center;}
.sticky .sp{flex-shrink:0;}
.sticky .sp .v{font-size:17px;font-weight:700;line-height:1.1;}
.sticky .sp .l{font-size:10.5px;color:var(--faint);}
.sticky .btn{flex:1;}
footer{padding:22px 14px 36px;text-align:center;}
footer p{font-size:11.5px;color:var(--faint);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="topbar-main">
      <div id="hleft"><button class="logo" onclick="openPDP('sun')">nova</button></div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search products" aria-label="Search">
      </div>
      <button class="ico" onclick="go('cart')" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cbadge" id="badge">0</span>
      </button>
    </div>
    <div class="catnav">
      <button>All</button><button class="act">Skincare</button><button>Sun care</button>
      <button>Make-up</button><button>Hair</button><button>Fragrance</button><button>Deals</button>
    </div>
  </div>
  <p class="crumbs" id="crumbs"></p>

  <!-- ===== PDP (generic, filled by JS) ===== -->
  <section class="view on" id="view-pdp">
    <div class="gal">
      <div class="gal-main"><div class="gal-stage" id="galMain"></div><span class="gal-count" id="galCount"></span></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="card" id="headCard"></div>
    <div id="focalBundle"></div>
    <div class="card" id="aboutCard"></div>
    <div id="focalRich"></div>
    <div id="focalRoutine"></div>
    <div id="focalAd"></div>
    <div class="card" id="recCard"></div>
    <div class="card" id="revCard"></div>
    <div class="sticky" id="stickyBar"></div>
  </section>

  <!-- ===== STORE ===== -->
  <section class="view" id="view-store">
    <div class="store-hero" id="storeHero"></div>
    <div class="card" id="storeBody"></div>
  </section>

  <!-- ===== CART ===== -->
  <section class="view" id="view-cart">
    <div class="card" style="margin-top:8px;"><h2 class="ptitle">Shopping cart</h2><div id="cartBody"></div></div>
  </section>

  <!-- ===== CHECKOUT ===== -->
  <section class="view" id="view-checkout">
    <div class="card" style="margin-top:8px;">
      <h2 class="ptitle">Checkout</h2>
      <div id="coSummary" style="background:var(--bg);border-radius:6px;padding:12px;margin-bottom:18px;"></div>
      <div class="fs"><h3>Contact</h3>
        <div class="fld"><label for="e">Email</label><input id="e" type="email" placeholder="you@example.com"></div></div>
      <div class="fs"><h3>Delivery address</h3>
        <div class="r2"><div class="fld"><label for="fn">First name</label><input id="fn"></div>
        <div class="fld"><label for="ln">Last name</label><input id="ln"></div></div>
        <div class="fld"><label for="ad">Address</label><input id="ad"></div>
        <div class="r2"><div class="fld"><label for="ct">City</label><input id="ct"></div>
        <div class="fld"><label for="zp">Postal code</label><input id="zp" inputmode="numeric"></div></div></div>
      <div class="fs"><h3>Payment</h3>
        <div class="fld"><label for="cn">Card number</label><input id="cn" placeholder="0000 0000 0000 0000" inputmode="numeric"></div>
        <div class="r2"><div class="fld"><label for="ex">Expiry</label><input id="ex" placeholder="MM / YY"></div>
        <div class="fld"><label for="cv">CVC</label><input id="cv" placeholder="123" inputmode="numeric"></div></div></div>
      <button class="btn primary" onclick="placeOrder()">Place order · <span id="coBtn"></span></button>
      <p style="text-align:center;font-size:11.5px;color:var(--faint);margin-top:9px;">This is a demonstration store. No payment is taken.</p>
    </div>
  </section>

  <!-- ===== CONFIRM ===== -->
  <section class="view" id="view-confirm">
    <div class="card" style="margin-top:8px;"><div class="confirm">
      <div class="ok"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E7B34" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h2>Order placed</h2><p>Thank you. A confirmation has been sent to your email.</p>
      <p class="ono">Order NV-<span id="ono">48120</span></p>
      <div style="margin-top:26px;"><button class="btn secondary" onclick="reset()">Continue shopping</button></div>
    </div></div>
  </section>

  <footer><p>NOVA · Demonstration marketplace</p></footer>
</div>

<script>
/* ================= ART ================= */
function tube(cap,body,label,accent,txt,spf){
  return '<svg viewBox="0 0 120 210" xmlns="http://www.w3.org/2000/svg">'+
  '<ellipse cx="60" cy="203" rx="38" ry="4" fill="#1B1D21" opacity=".07"/>'+
  '<rect x="42" y="6" width="36" height="26" rx="3" fill="'+cap+'"/>'+
  '<rect x="46" y="30" width="28" height="5" rx="1.5" fill="'+cap+'" opacity=".78"/>'+

               products:['sun','cleanser','serum','cream']},
  'AQUAVEIL': {store:'Aquaveil Official Store', rate:4.5, followers:'9.2k',  since:'2021',
               blurb:'Barrier-focused hydration for sensitive and reactive skin.',
               products:['aq1','aq3','aq2']},
  'DERMA+':   {store:'DermaPlus Store',         rate:4.6, followers:'24.1k', since:'2016',
               blurb:'Mineral sun protection developed with dermatologists.',
               products:['r1']},
  'KANSO':    {store:'Kanso Europe',            rate:4.7, followers:'41.7k', since:'2018',
               blurb:'Japanese-style UV care with a matte, weightless finish.',
               products:['r2']},
  'BARESKIN': {store:'BareSkin Official',       rate:4.3, followers:'6.8k',  since:'2020',

               products:['r3']},
  'LUMI\u00c8RE': {store:'Lumi\u00e8re Paris',          rate:4.9, followers:'52.3k', since:'2011',

};

const SHIP=3.95, FREE_OVER=25, BUNDLE_PRICE=19.99;
let cart={}, bundleOn=false, current='pdp', currentPid='sun', galIdx=0;
let navStack=[], currentStore=null, suppressPush=false;

/* ================= HELPERS ================= */
function eur(v){ return '€'+v.toFixed(2); }
function starRow(n){
  let h='';
  for(let i=1;i<=5;i++)
    h+='<svg viewBox="0 0 24 24" fill="'+(i<=Math.round(n)?'#F5A623':'none')+'" stroke="#F5A623" stroke-width="1.7" stroke-linejoin="round"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
  return h;
}
function itemCount(){ let n=0; for(const k in cart) n+=cart[k]; return n+(bundleOn?2:0); }
function subtotal(){ let s=0; for(const k in cart) s+=P[k].price*cart[k]; if(bundleOn) s+=BUNDLE_PRICE; return s; }
function shipCost(){ return itemCount()===0?0:(subtotal()>=FREE_OVER?0:SHIP); }
function total(){ return subtotal()+shipCost(); }

function pcard(id){
  const p=P[id];
  return '<button class="pcard" onclick="openPDP(\''+id+'\')">'+
    '<div class="pcard-img">'+p.art()+'</div>'+
    '<div class="pcard-brand">'+p.brand+'</div>'+
    '<div class="pcard-name">'+p.short+'</div>'+
    '<div class="pcard-rate"><span class="stars">'+starRow(p.rate)+'</span><span>'+p.rate+' ('+p.revs+')</span></div>'+
    '<div class="pcard-price">'+eur(p.price)+'</div></button>';
}

/* ================= PDP RENDER ================= */
function openPDP(id){ currentPid=id; galIdx=0; renderPDP(); go('pdp'); }

function renderGallery(){
  const p=P[currentPid];
  document.getElementById('galMain').innerHTML=p.gallery[galIdx]();
  document.getElementById('galCount').textContent=(galIdx+1)+' / '+p.gallery.length;
  document.getElementById('thumbs').innerHTML=p.gallery.map((f,i)=>
    '<button class="thumb-b'+(i===galIdx?' act':'')+'" onclick="setGal('+i+')" aria-label="Image '+(i+1)+'">'+f()+'</button>').join('');
}
function setGal(i){ galIdx=i; renderGallery(); }

function renderPDP(){
  const p=P[currentPid];
  renderGallery();

  document.getElementById('crumbs').innerHTML = p.focal
    ? 'Skincare › Sun care › <span>Face sunscreen</span>'
    : 'Skincare › '+p.brand+' › <span>'+p.short+'</span>';

  /* head */
  document.getElementById('headCard').innerHTML =
    (p.badge ? '<span class="bestseller"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 9.2 8.6 2 9.2l5.5 4.7L5.8 21 12 17.3 18.2 21l-1.7-7.1L22 9.2l-7.2-.6z"/></svg>'+p.badge+'</span>' : '')+
    '<a class="brandlink" href="#" onclick="openStore(\''+p.brand+'\');return false;">'+p.seller+' \u203a</a>'+
    '<h1>'+p.name+'</h1><p class="psize">'+p.size+'</p>'+
    '<div class="ratebar"><span class="stars">'+starRow(p.rate)+'</span><span class="rnum">'+p.rate+'</span>'+
      '<span class="rlink" onclick="jumpReviews()">'+p.revs+' reviews</span></div>'+
    '<div class="pmain">'+eur(p.price)+'</div><div class="punit">'+p.unit+'</div>'+
    '<div class="delivery"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+
      '<div>In stock · <b>Free delivery Thursday</b> on orders over €25</div></div>'+
    '<p class="seller">Sold by <a href="#" onclick="return false;">'+p.seller+'</a> · Delivered by NOVA</p>'+
    '<div class="btnstack">'+
      '<button class="btn primary" onclick="add(\''+p.id+'\');go(\'cart\')">Add to cart</button>'+
      '<button class="btn secondary" onclick="add(\''+p.id+'\');go(\'checkout\')">Buy now</button></div>';

  /* bundle — focal only */
 document.getElementById('focalBundle').innerHTML = p.focal ?
    '<div class="card"><div class="sh-row"><h2>Frequently bought together</h2><span class="tag deal">Bundle</span></div>'+
    '<div class="bundle">'+
      '<div class="bcell" onclick="openPDP(\'sun\')"><div class="bimg">'+P.sun.art()+'</div><p class="bname">Daily Face Sunscreen SPF 50+</p><p class="bprice">€14.99</p></div>'+
      '<span class="bplus">+</span>'+
      '<div class="bcell" onclick="openPDP(\'cleanser\')"><div class="bimg">'+P.cleanser.art()+'</div><p class="bname">Gentle Cleansing Gel</p><p class="bprice">€9.99</p></div>'+
    '</div>'+
    '<div class="bundle-foot"><div class="bundle-price"><span class="old">€24.98</span><div class="new">€19.99</div>'+
      '<span class="bundle-save">You save €4.99</span></div>'+
      '<button class="btn deal" style="width:auto;padding:10px 16px;font-size:13.5px;" onclick="addBundle()">Add both to cart</button></div></div>' : '';
  
  /* about + features */
  document.getElementById('aboutCard').innerHTML =
    '<h2 class="sh">About this product</h2><p class="body-txt">'+p.desc+'</p>'+
    '<ul class="feat">'+p.feat.map(f=>'<li>'+f+'</li>').join('')+'</ul>';

  /* rich content — focal only */
  document.getElementById('focalRich').innerHTML = p.focal ?
    '<div class="card"><h2 class="sh">Why people choose it</h2>'+
    '<div class="rich-panel"><div class="rich-img"><img src="images/rich-1.jpeg" alt="Invisible on every skin tone" loading="lazy"></div>'+
      '<p class="rich-cap">Invisible on every skin tone</p>'+
      '<p class="rich-txt">The fluid dries down clear instead of leaving the grey cast typical of mineral filters.</p></div>'+
    '<div class="rich-panel"><div class="rich-img"><img src="images/rich-2.jpeg" alt="Absorbs in under 30 seconds" loading="lazy"></div>'+
      '<p class="rich-cap">Absorbs in under 30 seconds</p>'+
      '<p class="rich-txt">A water-light texture that sinks in fast, so make-up goes on without pilling.</p></div>'+
    '<div class="rich-panel" style="margin-bottom:0;"><div class="rich-img"><img src="images/rich-3.jpeg" alt="Fragrance-free formula" loading="lazy"></div>'+
      '<p class="rich-cap">Fragrance-free formula</p>'+
      '<p class="rich-txt">No added perfume, alcohol or essential oils. Tested on sensitive and reactive skin.</p></div></div>' : '';

  /* routine — focal only */
  document.getElementById('focalRoutine').innerHTML = p.focal ?
    '<div class="card"><div class="sh-row"><h2>Complete the routine</h2><a href="#" onclick="openStore(\'SOLA\');return false;">Visit store \u203a</a></div>'+
    '<p style="font-size:12.5px;color:var(--faint);margin:-6px 0 11px;">More from SOLA Official Store</p>'+
    '<div class="rail">'+['cleanser','serum','cream'].map(pcard).join('')+'</div></div>' : '';

  /* AquaVeil banner — focal only */
  document.getElementById('focalAd').innerHTML = p.focal ?
    '<div class="card"><div class="ad ad-banner" onclick="openPDP(\'aq1\')">'+
    '<img src="images/aquaveil-banner.png" alt="AquaVeil hydration line" loading="lazy">'+
    '</div></div>' : '';

  /* recommendations — every product, excluding itself */
  const recs = ['sun','r2','r1','r4','r3'].filter(x=>x!==p.id).slice(0,4);
  document.getElementById('recCard').innerHTML =
    '<div class="sh-row"><h2>Recommended for you</h2></div>'+
    '<p style="font-size:12.5px;color:var(--faint);margin:-6px 0 11px;">Other sunscreens customers viewed</p>'+
    '<div class="rail">'+recs.map(pcard).join('')+'</div>';

  /* reviews */
  document.getElementById('revCard').innerHTML =
    '<h2 class="sh">Customer reviews</h2>'+
    '<div class="revsum"><div class="revbig"><div class="n">'+p.rate+'</div>'+
      '<div class="stars">'+starRow(p.rate)+'</div><div class="c">'+p.revs+' reviews</div></div>'+
    '<div class="dist">'+p.dist.map(([s,pc])=>
      '<div class="dist-row"><span class="lbl">'+s+'★</span><div class="dist-bar"><div class="dist-fill" style="width:'+pc+'%"></div></div><span class="pct">'+pc+'%</span></div>').join('')+
    '</div></div>'+
    '<div>'+p.reviews.map(r=>
      '<div class="rev"><div class="rev-top"><span class="stars">'+starRow(r.s)+'</span>'+
      '<span class="rev-name">'+r.n+'</span><span class="rev-ver">Verified purchase</span>'+
      '<span class="rev-date">'+r.d+'</span></div><p class="rev-body">'+r.t+'</p></div>').join('')+'</div>';

  /* sticky */
  document.getElementById('stickyBar').innerHTML =
    '<div class="sp"><div class="v">'+eur(p.price)+'</div><div class="l">Free del. over €25</div></div>'+
    '<button class="btn primary" onclick="add(\''+p.id+'\');go(\'cart\')">Add to cart</button>';
}

/* ================= STORE ================= */
function openStore(brand){
  const b = BRANDS[brand];
  if(!b) return;
  currentStore = brand;
  document.getElementById('storeHero').innerHTML =
    '<div class="store-top">'+
      '<div class="store-mark">'+brand+'</div>'+
      '<div class="store-nm"><h2>'+b.store+'</h2>'+
        '<div class="store-meta">\u2605 '+b.rate+' \u00b7 '+b.followers+' followers \u00b7 since '+b.since+'</div></div>'+
      '<button class="store-follow" onclick="this.textContent=(this.textContent===\'Follow\'?\'Following\':\'Follow\')">Follow</button>'+
    '</div>'+
    '<p class="store-blurb">'+b.blurb+'</p>';
  document.getElementById('storeBody').innerHTML =
    '<div class="sh-row"><h2>All products</h2><span style="font-size:12.5px;color:var(--faint);">'+b.products.length+' items</span></div>'+
    '<div class="store-grid">'+b.products.map(id=>{
      const q=P[id];
      return '<button class="sg-card" onclick="openPDP(\''+id+'\')">'+
        '<div class="sg-img">'+q.art()+'</div>'+
        '<div class="sg-nm">'+q.short+'</div>'+
        '<div class="sg-rate"><span class="stars">'+starRow(q.rate)+'</span><span>'+q.rate+' ('+q.revs+')</span></div>'+
        '<div class="sg-price">'+eur(q.price)+'</div></button>';
    }).join('')+'</div>';
  go('store');
}

/* ================= CART ================= */
function renderBadge(){ const b=document.getElementById('badge'),n=itemCount(); b.textContent=n; b.classList.toggle('on',n>0); }
function add(id){ cart[id]=(cart[id]||0)+1; renderBadge(); }
function setQty(id,n){ if(n<=0) delete cart[id]; else cart[id]=Math.min(9,n); renderBadge(); renderCart(); if(itemCount()===0&&current==='checkout') go('cart'); }
function addBundle(){ bundleOn=true; renderBadge(); go('cart'); }

function renderCart(){
  const el=document.getElementById('cartBody');
  if(itemCount()===0){
    el.innerHTML='<div class="empty"><p>Your cart is empty.</p><button class="btn secondary" onclick="openPDP(\'sun\')">Continue shopping</button></div>';
    return;
  }
  let h='';
  if(bundleOn){
    h+='<div class="li"><div class="li-img">'+P.sun.art()+'</div><div class="li-b">'+
      '<div class="li-brand">SOLA · Bundle</div><div class="li-name">Daily Face Sunscreen + Gentle Cleansing Gel</div>'+
      '<div class="li-price">'+eur(BUNDLE_PRICE)+' <span style="font-size:12px;color:var(--faint);text-decoration:line-through;font-weight:400;">€24.98</span></div>'+
      '<button class="rm" onclick="bundleOn=false;renderBadge();renderCart();">Remove</button></div></div>';
  }
  for(const id in cart){
    const p=P[id],q=cart[id];
    h+='<div class="li"><div class="li-img">'+p.art()+'</div><div class="li-b">'+
      '<div class="li-brand">'+p.brand+'</div><div class="li-name">'+p.short+'</div>'+
      '<div class="li-price">'+eur(p.price)+'</div>'+
      '<div class="qty"><button onclick="setQty(\''+id+'\','+(q-1)+')">−</button><span>'+q+'</span><button onclick="setQty(\''+id+'\','+(q+1)+')">+</button></div><br>'+
      '<button class="rm" onclick="setQty(\''+id+'\',0)">Remove</button></div></div>';
  }
  h+='<div style="margin-top:16px;">'+
    '<div class="tot"><span>Subtotal</span><span>'+eur(subtotal())+'</span></div>'+
    '<div class="tot"><span>Delivery</span><span>'+(shipCost()===0?'Free':eur(shipCost()))+'</span></div>'+
    '<div class="tot grand"><span>Total</span><span>'+eur(total())+'</span></div></div>'+
    '<div style="margin-top:18px;display:flex;flex-direction:column;gap:8px;">'+
    '<button class="btn primary" onclick="go(\'checkout\')">Proceed to checkout</button>'+
    '<button class="btn secondary" onclick="openPDP(\'sun\')">Continue shopping</button></div>';
  el.innerHTML=h;
}

function renderCheckout(){
  let rows='';
  if(bundleOn) rows+='<div class="tot"><span>Sunscreen + Cleansing Gel bundle</span><span>'+eur(BUNDLE_PRICE)+'</span></div>';
  for(const id in cart) rows+='<div class="tot"><span>'+P[id].short+' × '+cart[id]+'</span><span>'+eur(P[id].price*cart[id])+'</span></div>';
  rows+='<div class="tot"><span>Delivery</span><span>'+(shipCost()===0?'Free':eur(shipCost()))+'</span></div>';
  rows+='<div class="tot grand"><span>Total</span><span>'+eur(total())+'</span></div>';
  document.getElementById('coSummary').innerHTML=rows;
  document.getElementById('coBtn').textContent=eur(total());
}

/* ================= NAV ================= */
function go(v){
  if(!suppressPush && current && current!==v) navStack.push({view:current, pid:currentPid, store:currentStore});
  suppressPush=false;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.getElementById('view-'+v).classList.add('on');
  current=v;
  renderHeader();
  if(v==='cart') renderCart();
  if(v==='checkout') renderCheckout();
  window.scrollTo({top:0,behavior:'instant'});
  try{ history.pushState({app:1}, ''); }catch(e){}
}

function renderHeader(){
  const left=document.getElementById('hleft');
  const onFocal = (current==='pdp' && currentPid==='sun');
  if(onFocal || current==='confirm'){
    left.innerHTML='<button class="logo" onclick="home()">nova</button>';
  } else {
    left.innerHTML='<button class="back" onclick="goBack()">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Back</button>';
  }
  const cr=document.getElementById('crumbs');
  if(current==='pdp'){
    const p=P[currentPid];
    cr.innerHTML = p.focal ? 'Skincare \u203a Sun care \u203a <span>Face sunscreen</span>'
                           : 'Skincare \u203a '+p.brand+' \u203a <span>'+p.short+'</span>';
  } else if(current==='store'){
    cr.innerHTML = 'Skincare \u203a <span>'+(BRANDS[currentStore]? BRANDS[currentStore].store : '')+'</span>';
  } else { cr.innerHTML=''; }
}

function goBack(){
  const prev = navStack.pop();
  suppressPush = true;
  if(!prev){ currentPid='sun'; galIdx=0; renderPDP(); go('pdp'); return; }
  if(prev.view==='pdp'){ currentPid=prev.pid; galIdx=0; renderPDP(); go('pdp'); }
  else if(prev.view==='store'){ const b=prev.store; navStack.pop(); openStore(b); }
  else { go(prev.view); }
}

function home(){
  navStack=[]; suppressPush=true; currentPid='sun'; galIdx=0; renderPDP(); go('pdp');
}

/* device / browser back stays inside the prototype */
window.addEventListener('popstate', function(){
  try{ history.pushState({app:1}, ''); }catch(e){}
  if(current==='pdp' && currentPid==='sun' && navStack.length===0) return;
  goBack();
});

function jumpReviews(){ document.getElementById('revCard').scrollIntoView({behavior:'smooth'}); }
function placeOrder(){
  document.getElementById('ono').textContent=48000+Math.floor(Math.random()*900);
  cart={};bundleOn=false;renderBadge();go('confirm');
}
function reset(){
  cart={};bundleOn=false;renderBadge();
  document.querySelectorAll('.fld input').forEach(i=>i.value='');
  home();
}

renderPDP(); renderBadge(); renderHeader();
try{ history.pushState({app:1}, ''); }catch(e){}
</script>

<!-- ============================================================
     QUALTRICS BEHAVIOURAL TRACKING
     Sends interaction data to the parent page via postMessage.
     Harmless if the prototype is opened outside Qualtrics.
     ============================================================ -->
<script>
(function(){
  var T = {
    condition: "marketplace",
    seconds_on_page: 0,
    added_to_cart: 0,
    reached_cart: 0,
    reached_checkout: 0,
    completed_order: 0,
    items_in_cart: 0,
    cart_value: 0,
    products_viewed: 0,
    product_list: "",
    clicks: 0,
    max_scroll: 0,
    time_to_first_click: "",
    time_to_add: "",
    order_value: 0,
    order_items: 0,
    store_visits: 0,
    store_list: ""
  };
  var seen = [];
  var seenStores = [];
  var start = Date.now();
  function secs(){ return Math.round((Date.now()-start)/1000); }

  function snapshot(){
    try{
      T.items_in_cart = (typeof itemCount === "function") ? itemCount()
                        : (typeof qty !== "undefined" ? qty : 0);
      T.cart_value = (typeof total === "function") ? Number(total().toFixed(2)) : 0;
    }catch(e){}
    T.seconds_on_page = secs();
    T.product_list = seen.join("|");
    T.store_list = seenStores.join("|");
  }
  function send(){
    snapshot();
    try{ window.parent.postMessage({source:"shopPrototype", data:T}, "*"); }catch(e){}
  }
  function wrap(name, after){
    if(typeof window[name] !== "function") return;
    var orig = window[name];
    window[name] = function(){
      var r = orig.apply(this, arguments);
      try{ after.apply(null, arguments); }catch(e){}
      send();
      return r;
    };
  }
  function markAdd(){
    T.added_to_cart = 1;
    if(T.time_to_add === "") T.time_to_add = secs();
  }
  function markView(id){
    if(id && seen.indexOf(id) < 0){ seen.push(id); T.products_viewed = seen.length; }
  }

  wrap("add", function(id){ markAdd(); });
  wrap("addToCart", function(){ markAdd(); });
  wrap("addBundle", function(){ markAdd(); });
  // capture basket BEFORE placeOrder clears it
  if(typeof window.placeOrder === "function"){
    var _po = window.placeOrder;
    window.placeOrder = function(){
      try{
        T.order_value = (typeof total === "function") ? Number(total().toFixed(2)) : 0;
        T.order_items = (typeof itemCount === "function") ? itemCount()
                        : (typeof qty !== "undefined" ? qty : 0);
      }catch(e){}
      var r = _po.apply(this, arguments);
      T.completed_order = 1;
      send();
      return r;
    };
  }
  wrap("openPDP", function(id){ markView(id); });
  wrap("openStore", function(brand){
    if(brand && seenStores.indexOf(brand) < 0){ seenStores.push(brand); T.store_visits = seenStores.length; }
  });
  wrap("openSheet", function(id){ markView(id); });
  wrap("setQty", function(){});
  wrap("go", function(v){
    if(v === "cart") T.reached_cart = 1;
    if(v === "checkout") T.reached_checkout = 1;
  });

  document.addEventListener("click", function(){
    T.clicks++;
    if(T.time_to_first_click === "") T.time_to_first_click = secs();
  }, true);

  function scrollDepth(el){
    var h = (el === window)
      ? (document.body.scrollHeight - window.innerHeight)
      : (el.scrollHeight - el.clientHeight);
    var pos = (el === window) ? window.scrollY : el.scrollTop;
    if(h > 0){
      var d = Math.min(100, Math.round(pos / h * 100));
      if(d > T.max_scroll) T.max_scroll = d;
    }
  }
  window.addEventListener("scroll", function(){ scrollDepth(window); }, {passive:true});
  document.addEventListener("scroll", function(e){
    var el = e.target;
    if(el && el.classList && (el.classList.contains("sheet") || el.classList.contains("app"))) scrollDepth(el);
  }, true);

  setInterval(send, 5000);
  window.addEventListener("beforeunload", send);
  window.addEventListener("pagehide", send);
  send();
})();
</script>
